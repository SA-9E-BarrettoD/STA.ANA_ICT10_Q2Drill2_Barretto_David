
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Members</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 850px;
            margin-top: 65px;
        }

        .main-card {
            background: white;
            border: none;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        h2 {
            color: #243b64;
            font-weight: 700;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
            background: #f8faff;
        }

        .btn-primary {
            padding: 10px 24px;
            border-radius: 8px;
            background: #4263eb;
        }

        #results {
            margin-top: 25px;
            padding: 22px;
            background: #eef2ff;
            border-radius: 10px;
            color: #263b68;
        }

        #results ul {
            padding-left: 22px;
            margin-bottom: 18px;
        }

        #results li {
            padding: 4px 0;
        }

        #message {
            color: #dc3545;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="main-card">
            <h2 class="mb-4">Club Members</h2>

            <form id="memberForm">
                <div class="mb-3">
                    <input
                        type="text"
                        id="firstName"
                        class="form-control"
                        placeholder="First name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <input
                        type="text"
                        id="lastName"
                        class="form-control"
                        placeholder="Last name"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Add Member
                </button>

                <p id="message"></p>
            </form>

            <div id="results"></div>
        </div>
    </div>

    <script type="py">
from pyscript import document, when

# Predefined sets of club members
grade7 = {
    "Alice Blue",
    "Billy Sparks",
    "Joe Kerr",
    "Ella Vator"
}

grade8 = {
    "Anita Bath",
    "Eileen Dover",
    "Justin Case",
    "Paige Turner"
}

grade9 = {
    "Francisco Portero",
    "Juanito Lakar in".replace(" ", ""),
    "Tam Nguyen"
}

grade10 = {
    "Sheldon Cooper",
    "Restituto Fruto",
    "Ligaya Anonuevo"
}

# Combine all sets into one master set
members = grade7 | grade8 | grade9 | grade10

def display():
    # Sort names to make the results easier to read
    member_list = sorted(members)

    # Build the HTML output using an f-string
    names = "".join(
        f"<li>{name}</li>" for name in member_list
    )

    document.querySelector("#results").innerHTML = f"""
        <h5>All Members</h5>
        <ul>{names}</ul>
        <hr>
        <h5>Total Members: {len(members)}</h5>
    """

@when("submit", "#memberForm")
def add_member(event):
    event.preventDefault()

    first = document.querySelector("#firstName").value.strip()
    last = document.querySelector("#lastName").value.strip()

    full_name = f"{first} {last}".strip()

    if first and last:
        members.add(full_name)

        document.querySelector("#firstName").value = ""
        document.querySelector("#lastName").value = ""
        document.querySelector("#message").innerText = ""

        display()
    else:
        document.querySelector("#message").innerText = (
            "Please enter both names."
        )

display()
    </script>

    <script src="https://pyscript.net/releases/2025.3.1/core.js" type="module"></script>
</body>
</html>
